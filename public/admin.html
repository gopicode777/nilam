<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LandAudit Admin: Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F2;--card:#fff;--ink:#16201B;--mu:#66726B;--line:#E3E4DE;--g:#0E7A55;--gl:#E6F2EC;--bl:#1F57C3;--am:#D9A021;--rd:#B63A3A;--pu:#7A5AC8;--serif:Geist,"Noto Sans Tamil",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Geist,"Noto Sans Tamil",system-ui,sans-serif;font-feature-settings:"tnum" 1}
a{color:var(--g);font-weight:600;text-decoration:none}.mu{color:var(--mu)}.sm{font-size:12.5px}
.wrap{display:flex;gap:14px;padding:14px;min-height:100vh}.side{width:214px;flex:none;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px -16px rgba(16,26,21,.14);padding:16px 12px;position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column;gap:2px}
.logo{display:flex;gap:9px;align-items:center;font-weight:700;font-size:16px;padding:2px 10px 4px;color:var(--ink)}.logo svg{color:var(--g)}.tag{font-size:12px;color:var(--mu);padding:0 10px 16px}
.side a.n{padding:9px 12px;border-radius:12px;color:var(--mu);font-weight:500;transition:all .25s}.side a.n:hover{background:var(--bg);color:var(--ink);transform:translateX(2px)}.side a.n.on{background:var(--ink);color:#fff}
main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1280px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}h1{font:600 32px var(--serif);margin:0;letter-spacing:-.04em}h2{font:600 20px var(--serif);margin:38px 0 4px;letter-spacing:-.03em}
.banner{background:#E6EEFB;color:#1F57C3;padding:9px 12px;border-radius:6px;margin:14px 0 18px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid #D4D6CF;border-radius:99px;overflow:hidden;background:#fff;padding:3px}.seg button{border-radius:99px}.seg button{border:0;background:none;padding:6px 13px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer;transition:all .25s}.seg button.on{background:var(--ink);color:#fff}
select{font:inherit;border:1px solid #D4D6CF;border-radius:99px;padding:6px 8px;background:#fff}
.g{display:grid;gap:16px}.k6{grid-template-columns:repeat(6,1fr)}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c21{grid-template-columns:1.6fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(16,26,21,.04),0 12px 32px -18px rgba(16,26,21,.14);animation:rise .7s cubic-bezier(.2,.7,.2,1) both;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(16,26,21,.05),0 24px 44px -20px rgba(16,26,21,.24)}.card h3{margin:0 0 2px;font-size:14.5px}.card .why{color:var(--mu);font-size:12.5px;margin-bottom:12px}
.kpi b{display:block;font:600 30px var(--serif);letter-spacing:-.045em;margin-top:2px}.up{color:var(--g);font-weight:600;font-size:12.5px}.dn{color:var(--rd);font-weight:600;font-size:12.5px}
svg text{font-family:Geist,"Noto Sans Tamil",sans-serif}.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:600;font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}td{padding:9px 6px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes growx{from{transform:scaleX(0)}}@keyframes growy{from{transform:scaleY(0)}}@keyframes pop{from{opacity:0;transform:scale(.9)}}@keyframes fadein{from{opacity:0}}
.gx{transform-origin:left;animation:growx 1s cubic-bezier(.2,.7,.2,1) both}.gy{transform-box:fill-box;transform-origin:bottom;animation:growy .9s cubic-bezier(.2,.7,.2,1) both}.dn path{animation:pop .9s cubic-bezier(.2,.7,.2,1) both;transform-origin:0 0}.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards}.ar{animation:fadein 1.4s .6s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}}
#tip{position:fixed;pointer-events:none;background:#16201B;color:#fff;padding:6px 10px;border-radius:5px;font-size:12px;display:none;z-index:9;white-space:nowrap}
.feed div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.feed div:last-child{border:0}.feed span:first-child{flex:1}
@media(max-width:1000px){.side{display:none}.k6,.c2,.c3,.c21{grid-template-columns:1fr 1fr}main{padding:18px}}@media(max-width:600px){.k6,.c2,.c3,.c21{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
<aside class="side"><div class="logo"><svg width="24" height="24" viewBox="0 0 32 32" fill="none"><path d="M5 9l10-5 12 6-2 14-11 5-9-8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/></svg>LandAudit</div><div class="tag" data-t="Admin analytics|நிர்வாக பகுப்பாய்வு"></div>
<a class="n on" href="#overview" data-t="Overview|மேலோட்டம்"></a><a class="n" href="#growth" data-t="Growth|வளர்ச்சி"></a><a class="n" href="#funnel" data-t="Funnel|படிநிலை"></a><a class="n" href="#revenue" data-t="Revenue|வருவாய்"></a><a class="n" href="#quality" data-t="Audit quality|தணிக்கை தரம்"></a><a class="n" href="#ops" data-t="Operations|செயல்பாடு"></a><a class="n" href="#geo" data-t="Geography|புவியியல்"></a>
<div style="flex:1"></div><a class="n" href="./" data-t="← Back to app|← செயலிக்கு"></a><a class="n" href="./#/admin" data-t="Admin console|நிர்வாக பலகை"></a></aside>
<main id="overview">
<div class="top"><div><h1 data-t="How the business is doing|வணிகம் எப்படி செல்கிறது"></h1><div class="mu" data-t="Everything an owner needs to see on one page.|உரிமையாளர் ஒரே பக்கத்தில் காண வேண்டியவை."></div></div><div style="flex:1"></div>
<div class="seg" id="per"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></div><select id="lang" aria-label="Language"><option value="en">English</option><option value="ta">தமிழ்</option></select></div>
<div class="banner" data-t="Placeholder data for demonstration. Every number here is generated; the layout shows what the live dashboard will report once the backend is connected.|காட்சிக்கான மாதிரி தரவு. இங்குள்ள எல்லா எண்களும் உருவாக்கப்பட்டவை; backend இணைந்ததும் உண்மை தரவு இதே அமைப்பில் வரும்."></div>
<div class="banner" id="live" style="background:#E6F2EC;color:#0A6244;display:none"></div>
<div class="g k6" id="kpis"></div>

<h2 id="growth" data-t="Growth|வளர்ச்சி"></h2><div class="mu sm" data-t="Are more people arriving, and are they actually running audits?|அதிகம் பேர் வருகிறார்களா, தணிக்கை நடத்துகிறார்களா?"></div>
<div class="g c21" style="margin-top:12px"><div class="card"><h3 data-t="Sign-ups and audits per day|நாளொன்றுக்கு பதிவு & தணிக்கை"></h3><div class="why" data-t="Hover the chart to read a day.|ஒரு நாளை படிக்க வரைபடத்தின் மீது செல்க."></div><div id="line"></div><div class="leg" id="lineLeg"></div></div>
<div class="card"><h3 data-t="Where users come from|பயனர்கள் எங்கிருந்து"></h3><div class="why" data-t="Share of sign-ups by channel.|சேனல் வாரியாக பதிவு."></div><div id="chan"></div></div></div>

<h2 id="funnel" data-t="Funnel|படிநிலை"></h2><div class="mu sm" data-t="Where people drop off between signing up and paying.|பதிவு முதல் கட்டணம் வரை எங்கு வெளியேறுகிறார்கள்."></div>
<div class="g c2" style="margin-top:12px"><div class="card"><h3 data-t="Sign-up to paying customer|பதிவு முதல் கட்டணம் வரை"></h3><div class="why" data-t="Each bar is a share of everyone who signed up.|ஒவ்வொரு பட்டையும் பதிவு செய்த அனைவரின் பங்கு."></div><div id="fun"></div></div>
<div class="card"><h3 data-t="Time to first report|முதல் அறிக்கை வரை நேரம்"></h3><div class="why" data-t="Minutes from creating a case to a finished audit.|வழக்கு உருவாக்கம் முதல் தணிக்கை முடிவு வரை நிமிடங்கள்."></div><div id="ttr"></div></div></div>

<h2 id="revenue" data-t="Revenue|வருவாய்"></h2><div class="mu sm" data-t="What was bought, and how much it brought in.|எது வாங்கப்பட்டது, எவ்வளவு வருமானம்."></div>
<div class="g c21" style="margin-top:12px"><div class="card"><h3 data-t="Weekly revenue by pack (₹)|வாரந்திர வருவாய் (₹)"></h3><div class="why" data-t="Single audit, Buyer pack, Advisor pack.|ஒரு தணிக்கை, வாங்குபவர் பேக், ஆலோசகர் பேக்."></div><div id="rev"></div><div class="leg" id="revLeg"></div></div>
<div class="card"><h3 data-t="Users by plan|திட்ட வாரியாக பயனர்கள்"></h3><div class="why" data-t="Free users are the pool to convert.|இலவச பயனர்களே மாற்ற வேண்டிய பிரிவு."></div><div id="plan"></div></div></div>

<h2 id="quality" data-t="Audit quality|தணிக்கை தரம்"></h2><div class="mu sm" data-t="What the audits are finding, and how well the reading works.|தணிக்கைகள் என்ன கண்டறிகின்றன, வாசிப்பு எவ்வளவு துல்லியம்."></div>
<div class="g c3" style="margin-top:12px"><div class="card"><h3 data-t="Score distribution|மதிப்பெண் பரவல்"></h3><div class="why" data-t="Audits per score band.|மதிப்பெண் வரம்பு வாரியாக தணிக்கைகள்."></div><div id="hist"></div></div>
<div class="card"><h3 data-t="Verdicts given|வழங்கிய முடிவுகள்"></h3><div class="why" data-t="How the reports ended.|அறிக்கைகள் எப்படி முடிந்தன."></div><div id="verd"></div></div>
<div class="card"><h3 data-t="Reading accuracy by document|ஆவண வாரியாக வாசிப்பு துல்லியம்"></h3><div class="why" data-t="Values users did not need to correct.|பயனர் திருத்த தேவையில்லாத மதிப்புகள்."></div><div id="ocr"></div></div></div>
<div class="card" style="margin-top:16px"><h3 data-t="Most common findings|அடிக்கடி வரும் முடிவுகள்"></h3><div class="why" data-t="The problems buyers run into most.|வாங்குபவர்கள் அதிகம் சந்திக்கும் சிக்கல்கள்."></div><div id="top"></div></div>

<h2 id="ops" data-t="Operations|செயல்பாடு"></h2><div class="mu sm" data-t="Is the machine healthy, and are people being served on time?|அமைப்பு நலமா, சேவை நேரத்தில் நடக்கிறதா?"></div>
<div class="g c2" style="margin-top:12px"><div class="card"><h3 data-t="Professional review queue|நிபுணர் மதிப்பாய்வு வரிசை"></h3><div class="why" data-t="Requests by stage and promised turnaround.|நிலை வாரியாக கோரிக்கைகள், வாக்களித்த நேரம்."></div><div id="rq"></div></div>
<div class="card"><h3 data-t="Data source health|தரவு மூல நிலை"></h3><div class="why" data-t="Sources not connected show as “not verified” to users.|இணைக்கப்படாத மூலங்கள் பயனருக்கு “சரிபார்க்கவில்லை” என காட்டும்."></div><div id="src"></div></div></div>

<h2 id="geo" data-t="Geography|புவியியல்"></h2><div class="mu sm" data-t="Which districts the plots are in.|நிலங்கள் எந்த மாவட்டங்களில்."></div>
<div class="g c21" style="margin-top:12px"><div class="card"><h3 data-t="Audits by district|மாவட்ட வாரியாக தணிக்கைகள்"></h3><div class="why" data-t="Top 10 districts.|முதல் 10 மாவட்டங்கள்."></div><div id="geo"></div></div>
<div class="card"><h3 data-t="Latest activity|சமீபத்திய செயல்கள்"></h3><div class="why" data-t="What is happening right now.|இப்போது நடப்பவை."></div><div class="feed" id="feed"></div></div></div>
</main></div><div id="tip"></div>
<script>
const $=s=>document.querySelector(s);let days=30,lang='en';
try{const st=JSON.parse(localStorage.getItem('landaudit_v4')||'null');if(st&&st.lang)lang=st.lang;window.__st=st}catch(e){}
const T=s=>{const p=s.split('|');return lang==='ta'&&p[1]?p[1]:p[0]};
function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const C={g:'#0E7A55',bl:'#1F57C3',am:'#D9A021',rd:'#B63A3A',pu:'#7A5AC8',gr:'#C9CCC3'};
const fmt=n=>n>=1e5?'₹'+(n/1e5).toFixed(1)+'L':n.toLocaleString('en-IN');
function data(){const r=rnd(days*7+3),d=[],base=26+r()*6;for(let i=0;i<days;i++){const t=base*(1+i/days*.8)*(1+Math.sin(i/2.2)*.18)*(1+(r()-.5)*.3);d.push({su:Math.round(t),au:Math.round(t*(.62+r()*.12))})}return d}
function spark(v,c){const w=96,h=30,mx=Math.max(...v),mn=Math.min(...v);return`<svg width="${w}" height="${h}"><polyline fill="none" stroke="${c}" stroke-width="2" points="${v.map((x,i)=>(i/(v.length-1)*w).toFixed(1)+','+(h-3-(x-mn)/(mx-mn||1)*(h-6)).toFixed(1)).join(' ')}"/></svg>`}
function line(d){const W=720,H=250,p={l:38,r:10,t:10,b:24},mx=Math.max(...d.map(x=>x.su))*1.1,X=i=>p.l+i/(d.length-1)*(W-p.l-p.r),Y=v=>H-p.b-v/mx*(H-p.t-p.b);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" id="lsvg">`;
for(let i=0;i<=4;i++){const v=mx/4*i,y=Y(v);s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#EEF0EA"/><text x="${p.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#66726B">${Math.round(v)}</text>`}
const pts=k=>d.map((x,i)=>X(i).toFixed(1)+','+Y(x[k]).toFixed(1)).join(' ');
s+=`<polygon class="ar" points="${p.l},${H-p.b} ${pts('su')} ${W-p.r},${H-p.b}" fill="${C.bl}" opacity=".08"/><polyline class="ln" pathLength="1" points="${pts('su')}" fill="none" stroke="${C.bl}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><polyline class="ln" pathLength="1" points="${pts('au')}" fill="none" stroke="${C.g}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
[0,Math.floor(d.length/2),d.length-1].forEach(i=>{s+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i?i==d.length-1?'end':'middle':'start'}" font-size="11" fill="#66726B">${T('Day|நாள்')} ${i+1}</text>`});
s+=`<line id="cur" y1="${p.t}" y2="${H-p.b}" stroke="#16201B" opacity="0"/></svg>`;$('#line').innerHTML=s;
const sv=$('#lsvg'),tip=$('#tip');sv.onmousemove=e=>{const r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(d.length-1,Math.round((x-p.l)/(W-p.l-p.r)*(d.length-1))));const c=$('#cur');c.setAttribute('x1',X(i));c.setAttribute('x2',X(i));c.setAttribute('opacity',.25);tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+10+'px';tip.textContent=`${T('Day|நாள்')} ${i+1}: ${d[i].su} ${T('sign-ups|பதிவுகள்')}, ${d[i].au} ${T('audits|தணிக்கைகள்')}`};sv.onmouseleave=()=>{tip.style.display='none';$('#cur').setAttribute('opacity',0)};
$('#lineLeg').innerHTML=`<span><i style="background:${C.bl}"></i>${T('Sign-ups|பதிவுகள்')}</span><span><i style="background:${C.g}"></i>${T('Audits run|தணிக்கைகள்')}</span>`}
function hbars(el,rows,col,unit=''){const mx=Math.max(...rows.map(r=>r[1]));$(el).innerHTML=rows.map(r=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:170px;font-size:13px">${r[0]}</span><div style="flex:1;height:10px;background:#F1F2EE;border-radius:5px;overflow:hidden"><div class="gx" style="width:${r[1]/mx*100}%;height:100%;background:${r[2]||col};border-radius:5px"></div></div><b style="width:64px;text-align:right">${r[1].toLocaleString('en-IN')}${unit}</b></div>`).join('')}
function donut(el,rows,center){const tot=rows.reduce((a,r)=>a+r[1],0);let a0=-Math.PI/2,s=`<svg class="dn" viewBox="0 0 220 160" width="100%" style="max-height:170px"><g transform="translate(70,80)">`;rows.forEach(r=>{const a=r[1]/tot*Math.PI*2,x0=Math.cos(a0)*62,y0=Math.sin(a0)*62,x1=Math.cos(a0+a)*62,y1=Math.sin(a0+a)*62;s+=`<path d="M${x0} ${y0}A62 62 0 ${a>Math.PI?1:0} 1 ${x1} ${y1}" fill="none" stroke="${r[2]}" stroke-width="22" style="animation-delay:${rows.indexOf(r)*120}ms"><title>${r[0]}: ${Math.round(r[1]/tot*100)}%</title></path>`;a0+=a});
s+=`<text text-anchor="middle" y="6" font-size="20" font-weight="600" font-family="Geist,sans-serif">${center}</text></g>`;rows.forEach((r,i)=>{s+=`<rect x="150" y="${28+i*24}" width="9" height="9" rx="2" fill="${r[2]}"/><text x="164" y="${37+i*24}" font-size="12" fill="#16201B">${r[0]} ${Math.round(r[1]/tot*100)}%</text>`});$(el).innerHTML=s+'</svg>'}

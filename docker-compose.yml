services:
  db:
    image: postgis/postgis:16-3.4   # PostGIS ready for future survey / GIS layers
    environment: { POSTGRES_USER: nilam, POSTGRES_PASSWORD: change-me, POSTGRES_DB: nilam }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nilam"], interval: 5s, retries: 10 }
  app:
    build: .
    ports: ["8080:8080"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nilam:change-me@db/nilam
      CLIENT_ORIGIN: http://localhost:8080
    volumes: ["uploads:/data"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {}, uploads: {} }

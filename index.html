<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LandAudit AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0C9F6E;--d:#0B2D3A;--lb:#E6F6FF;--bg:#F7FBFF;--c:#fff;--t:#1E293B;--tg:#64748B;--b:#E2E8F0;--ok:#22C55E;--w:#F59E0B;--er:#EF4444;--sf:#E7F7F1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a20;--c:#10262e;--t:#e6eef2;--tg:#93a7b1;--b:#1e3a45;--sf:#12382f;--lb:#12303b}}
:root[data-theme="dark"]{--bg:#0a1a20;--c:#10262e;--t:#e6eef2;--tg:#93a7b1;--b:#1e3a45;--sf:#12382f;--lb:#12303b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--t);font:13px/1.5 Poppins,system-ui,sans-serif}
h1,h2,h3,p{margin:0}h1{font-size:22px;font-weight:600}h2{font-size:15px;font-weight:600}.m{color:var(--tg);font-size:12px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;box-shadow:0 1px 3px #0b2d3a0d}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:44px;font:600 13px Poppins,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.o{background:var(--c);color:var(--g);border:1px solid var(--g)}.btn.s{min-height:34px;padding:0 12px;font-size:12px}
.bd{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--sf);color:var(--g);white-space:nowrap}.bd.w{background:#FEF3DC;color:#B7791F}.bd.e{background:#FDE8E8;color:var(--er)}
input,select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.ico{width:38px;height:38px;border-radius:10px;background:var(--lb);color:var(--g);display:grid;place-items:center;flex:none}
.aer{width:100%;height:100%;display:block}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--d);color:#b9ccd4;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--t)}aside .logo{color:#fff;margin:0 8px 22px}
.lg{width:28px;height:28px;border-radius:8px 14px 8px 14px;background:linear-gradient(135deg,#3ddc97,var(--g))}
.nv{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;cursor:pointer;font-weight:500;background:none;border:0;color:inherit;font-family:inherit;font-size:13px;width:100%;text-align:left}
.nv.on{background:var(--g);color:#fff}.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:8px;color:#fff}.av{width:34px;height:34px;border-radius:50%;background:#f4c9a4;flex:none;display:grid;place-items:center;color:var(--d);font-weight:700}
main{padding:24px 28px;min-width:0;max-width:1240px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g4{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mapw{position:relative;border-radius:14px;overflow:hidden;min-height:260px;cursor:crosshair}.mapw .aer{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-100%);width:30px;height:30px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--g);border:3px solid #fff;box-shadow:0 2px 8px #0005;pointer-events:none;animation:pop .3s}.pin.me{background:#2563EB;width:36px;height:36px}
.pin span{rotate:45deg;display:grid;place-items:center;height:100%;color:#fff}@keyframes pop{from{scale:0}}
.float{position:absolute;left:14px;bottom:14px;right:14px;max-width:340px;background:var(--c);border-radius:12px;padding:12px;box-shadow:0 6px 20px #0003}
.ai{display:flex;flex-direction:column;height:560px}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.b{padding:10px 12px;border-radius:12px;background:var(--lb);max-width:92%;animation:pop .25s}.b.u{align-self:flex-end;background:var(--g);color:#fff}
.q{border:1px solid var(--b);background:var(--lb);color:var(--g);border-radius:10px;padding:8px 12px;margin:0 6px 6px 0;font:500 12px Poppins;cursor:pointer;min-height:36px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pn>div{padding:10px;border-radius:10px;font-size:12px}.pn .p{background:var(--sf)}.pn .c{background:#FEF3DC;color:#7a5410}.pn b{display:block;margin-bottom:4px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:var(--tg);font-weight:500;font-size:12px}td,th{padding:11px 10px;border-bottom:1px solid var(--b)}
.st{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.st span{padding:6px 14px;border-radius:99px;background:var(--lb);color:var(--tg);font-weight:500;font-size:12px}.st .on{background:var(--g);color:#fff}
.drop{border:2px dashed var(--g);background:var(--lb);border-radius:14px;padding:26px;text-align:center}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--b)}.li:last-child{border:0}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .8s}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl label{font-size:11px;color:var(--tg)}
.paper{background:#fff;color:#1E293B;border-radius:6px;padding:28px;box-shadow:0 10px 30px #0b2d3a33;max-width:720px;margin:auto}.paper td{padding:6px;border-bottom:1px solid #e5e7eb}
.th{width:70px;height:96px;background:#fff;border-radius:4px;border:2px solid var(--b);margin-bottom:8px}.th.on{border-color:var(--g)}
.tg{width:42px;height:24px;border-radius:99px;background:var(--b);position:relative;cursor:pointer;border:0}.tg.on{background:var(--g)}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on:after{left:21px}
.bnav{display:none}.pub{display:flex;justify-content:space-between;align-items:center;padding:16px 6vw;gap:12px;flex-wrap:wrap}.pub nav{display:flex;gap:22px;color:var(--tg)}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;padding:20px 6vw;align-items:center}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.1;font-weight:700}.hero h1 em{color:var(--g);font-style:normal}
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
@media(max-width:1024px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.shell{grid-template-columns:200px 1fr}}
@media(max-width:768px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:14px 14px 90px}.g4,.hero,.login{grid-template-columns:1fr}.login>.mapw{min-height:200px}.ai{height:480px}.pub nav{display:none}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:9}.bnav button{flex:1;background:none;border:0;color:var(--tg);font:500 10px Poppins;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;cursor:pointer}.bnav .on{color:var(--g)}.fl{grid-template-columns:1fr}}
@media print{aside,.bnav,.noprint,.th{display:none!important}.shell{display:block}main{padding:0}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),P={file:'M6 2h9l5 5v15H6zM14 2v6h6',home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',doc:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h7M9 17h7',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',pin:'M12 22s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12zM12 12a2 2 0 100-4 2 2 0 000 4',bell:'M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0',gear:'M12 15a3 3 0 100-6 3 3 0 000 6M19 12l2-1-2-4-2 1-2-1-1-2H9L8 7 6 8 4 7l-2 4 2 1v2l-2 1 2 4 2-1 2 1 1 2h4l1-2 2-1 2 1 2-4-2-1z',search:'M11 18a7 7 0 100-14 7 7 0 000 14M21 21l-5-5',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',check:'M5 12l5 5 9-10',up:'M12 16V4M6 10l6-6 6 6M4 20h16',arr:'M9 6l6 6-6 6',help:'M12 22a10 10 0 100-20 10 10 0 000 20M9.5 9a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17v.5',user:'M12 12a4 4 0 100-8 4 4 0 000 8M4 21c0-4 4-6 8-6s8 2 8 6',warn:'M12 3l10 18H2zM12 10v4M12 17v.5',lock:'M6 11h12v10H6zM8 11V7a4 4 0 118 0v4',more:'M5 12h.01M12 12h.01M19 12h.01',trash:'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14',chat:'M21 12a8 8 0 01-11 7l-6 2 2-5a8 8 0 1115-4'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const logo=`<div class="logo"><span class="lg"></span>LandAudit AI</div>`;
function aer(s){let x=s*9301,r=()=>(x=(x*49297+233280)%233280)/233280,p='';const G=['#5c9a3c','#7db24a','#a5c85a','#3f7d34','#c9d98a','#8fbf62','#e3e0a0'];for(let i=0;i<44;i++){const a=r()*400,b=r()*260;p+=`<rect x="${a}" y="${b}" width="${30+r()*70}" height="${20+r()*50}" fill="${G[i%7]}" transform="rotate(${r()*30-15} ${a} ${b})"/>`}return `<svg class="aer" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"><rect width="400" height="260" fill="#6aa544"/>${p}<path d="M-10 200C90 150 170 230 270 170S380 150 420 190" stroke="#3d8fc4" stroke-width="16" fill="none"/><path d="M0 90H400M180 0L230 260" stroke="#f1eee0" stroke-width="3" fill="none" opacity=".8"/></svg>`}
function ring(v,z=130){const C=282.7;return `<svg width="${z}" height="${z}" viewBox="0 0 110 110"><circle cx="55" cy="55" r="45" fill="none" stroke="var(--b)" stroke-width="10"/><circle cx="55" cy="55" r="45" fill="none" stroke="var(--g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 55 55)" style="transition:stroke-dasharray .5s"/><text x="55" y="61" text-anchor="middle" font-size="22" font-weight="600" fill="var(--t)">${v}${v<=100&&v!=82?'%':''}</text></svg>`}
/* ---- state + mock services (swap for real APIs later) ---- */
const S={p:[50,58],chat:[],saved:[{n:'Nagapattinam Plot A',s:'82/100 · Good',t:'',seed:3},{n:'Mayiladuthurai Land',s:'Needs Review',t:'w',seed:7},{n:'Chennai Land',s:'Moderate',t:'w',seed:11}],user:'Gopi',tab:'Profile',
 alerts:[['ok','Audit completed','Your Nagapattinam land audit is ready.','2h ago'],['ok','Document verification completed','All 4 documents processed.','2h ago'],['w','Survey number mismatch detected','Sale Deed and Patta differ. Review needed.','5h ago'],['w','Flood risk detected in the area','Moderate risk near selected plot.','5h ago'],['ok','New information available','Update for a saved location.','1d ago']],
 f:{'Owner Name':'R. Kumar','Survey Number':'123/4A','Village':'Nagapattinam','Taluk':'Nagapattinam','District':'Nagapattinam','Area':'2,400 sq.ft','Document No':'430/2023','Date':'12-06-2023'},tg:{e:1,a:1,d:0}};
const POI={hospital:{n:'Nagapattinam Government Hospital',i:'H',x:22,y:28},college:{n:'Arts College',i:'C',x:72,y:30},bus:{n:'Bus Stand',i:'B',x:82,y:76}};
const mapService={dist:k=>(Math.hypot(POI[k].x-S.p[0],POI[k].y-S.p[1])/9).toFixed(1),dir:k=>POI[k].y<S.p[1]?'North':'South',coords:()=>`${(10.7672+(50-S.p[1])*.0006).toFixed(4)}° N, ${(79.8449+(S.p[0]-50)*.0006).toFixed(4)}° E`,flood:()=>Math.hypot(S.p[0]-25,S.p[1]-75)<28?'High':'Moderate'};
const aiService={ask(q){q=q.toLowerCase();const m=mapService;
 if(/hospital|nearby|important/.test(q))return `Yes, there is a hospital approximately <b>${m.dist('hospital')} km ${m.dir('hospital').toLowerCase()}</b> of the selected location.<div class="card" style="margin-top:8px;padding:10px"><b>${POI.hospital.n}</b><div class="m">${m.dist('hospital')} km • ${m.dir('hospital')}</div></div>`;
 if(/bus|road|distance/.test(q))return `The nearest bus stand is about <b>${m.dist('bus')} km</b> away.`;
 if(/positive|negative|disadv|pros/.test(q))return `<div class="pn"><div class="p"><b>Positives</b>Hospital — ${m.dist('hospital')} km<br>College — ${m.dist('college')} km<br>Main road — 800 m<br>Good connectivity</div><div class="c"><b>Things to consider</b>Bus stand — ${m.dist('bus')} km<br>Flood risk: ${m.flood()}<br>Limited public transport<br>Higher than average price</div></div>`;
 if(/water|flood/.test(q))return `Flood risk nearby appears <b>${m.flood()}</b>. Information could not be verified from an official source yet.`;
 return 'I can help with hospitals, roads, bus stand, water and pros/cons. No legal clearance is implied by any answer.'}};
const ocrService={run:()=>new Promise(r=>setTimeout(()=>r(S.f),1800))};
const docCmp=[['Survey Number','123/4A','123/4B','123/4A'],['Area','2,400 sq.ft','2,400 sq.ft','2,000 sq.ft'],['Owner Name','R. Kumar','R. Kumar','R. Kumar'],['Village','Nagapattinam','Nagapattinam','Nagapattinam'],['Taluk','Nagapattinam','Nagapattinam','Nagapattinam'],['District','Nagapattinam','Nagapattinam','Nagapattinam']];
const NAV=[['dash','home','Home / AI + Map'],['docs','doc','Documents'],['audit','shield','Land Audit'],['report','chart','My Reports'],['saved','pin','Saved Places'],['alerts','bell','Alerts'],['settings','gear','Settings']];
const grp={dash:'dash',map:'dash',docs:'docs',compare:'docs',audit:'audit',result:'audit',report:'report',saved:'saved',alerts:'alerts',settings:'settings',help:'settings'};
let tm;const go=n=>{location.hash='/'+n};
function shell(pg,body){const a=grp[pg];return `<div class="shell"><aside>${logo}${NAV.map(n=>`<button class="nv ${n[0]==a?'on':''}" onclick="go('${n[0]}')">${ic(n[1])}${n[2]}</button>`).join('')}<div class="me"><span class="av">G</span><div><b>${S.user}</b><div style="font-size:11px;opacity:.7">gopi@example.com</div></div></div></aside><main>${body}</main></div>
<nav class="bnav">${[['dash','home','Home'],['map','pin','Map'],['docs','doc','Docs'],['audit','shield','Audit'],['report','chart','Reports'],['settings','more','More']].map(n=>`<button class="${n[0]==pg||n[0]==a&&n[0]!='dash'?'on':''}" onclick="go('${n[0]}')">${ic(n[1])}${n[2]}</button>`).join('')}</nav>`}
const hd=(t,s,x='')=>`<div class="top"><div><h1>${t}</h1><p class="m">${s}</p></div>${x}</div>`;
/* ---- screens ---- */
const V={
landing:()=>`<div class="pub">${logo}<nav><span>Home</span><span>Features</span><span>How It Works</span><span>Pricing</span><span>About</span></nav><div class="row"><button class="btn o s" onclick="go('login')">Login</button><button class="btn s" onclick="go('login')">Get Started</button></div></div>
<div class="hero"><div class="col" style="gap:18px"><h1>Know the Land<br><em>Before You Buy</em></h1><p class="m" style="font-size:14px;max-width:420px">AI-powered land analysis, document verification and risk assessment — all in one place.</p><div class="row wrap"><button class="btn" onclick="go('login')">Get Started Free</button><button class="btn o" onclick="go('login')">▶ Watch Demo</button></div></div>
<div class="mapw" style="min-height:340px;border-radius:24px">${aer(5)}<div class="float" style="left:auto;right:16px;top:30px;bottom:auto;width:210px"><b class="m">Land Readiness Score</b><div style="font-size:26px;font-weight:700">82<span class="m">/100</span></div>${['Location','Documents','Environment','Price'].map(x=>`<div class="row sp m">${x}<span style="color:var(--ok)">${ic('check')}</span></div>`).join('')}</div></div></div>
<div class="g3" style="padding:20px 6vw 40px">${[['chart','AI-Powered Analysis','Get intelligent insights'],['doc','Official Data Verification','Cross-check with government sources'],['shield','Environmental & Risk Check','Understand potential risks'],['file','Detailed Reports','Make informed decisions']].map(x=>`<div class="row"><span class="ico">${ic(x[1]=='file'?'doc':x[0])}</span><div><b>${x[1]}</b><div class="m">${x[2]}</div></div></div>`).join('')}</div>`,
login:(su)=>`<div class="login"><div class="mapw" style="border-radius:0;cursor:default">${aer(2)}<div style="position:absolute;left:30px;bottom:40px;color:#fff;font-size:26px;font-weight:600;text-shadow:0 2px 10px #0008">Better Insights.<br>Safer Investments.</div></div>
<div class="col" style="justify-content:center;padding:6vw;max-width:520px;margin:auto;width:100%"><h1>Welcome Back</h1><p class="m">Sign in to your account</p><div class="row" style="background:var(--lb);border-radius:10px;padding:4px"><button class="btn s ${su?'o':''}" style="flex:1;border:0" onclick="go('login')">Login</button><button class="btn s ${su?'':'o'}" style="flex:1;border:0" onclick="location.hash='/signup'">Sign Up</button></div>
${su?'<label class="m">Full name<input value="Gopi"></label>':''}<label class="m">Email address<input id="em" placeholder="you@example.com"></label><label class="m">Password<input type="password" placeholder="Enter your password"></label>
<div class="row sp m"><label class="row"><input type="checkbox" style="width:16px;min-height:16px"> Remember me</label><span style="color:var(--g)">Forgot password?</span></div><button class="btn" onclick="S.user=(($('#em').value.split('@')[0])||'Gopi');S.user=S.user[0].toUpperCase()+S.user.slice(1);go('dash')">${su?'Create account':'Login'}</button>
<p class="m" style="text-align:center">or continue with</p><div class="row"><button class="btn o" style="flex:1" onclick="go('dash')">Google</button><button class="btn o" style="flex:1" onclick="go('dash')">Microsoft</button></div></div></div>`,
dash:()=>shell('dash',`<div class="top"><div><h1>Good morning, ${S.user} 👋</h1><p class="m">Explore, analyse and make informed decisions about your land.</p></div><div class="row"><div class="row card" style="padding:0 12px;min-height:44px;min-width:260px">${ic('search')}<input placeholder="Search location, place or survey number..." style="border:0;min-height:40px"></div><button class="nv" style="width:auto;color:var(--tg)" onclick="go('alerts')">${ic('bell')}</button></div></div>
<div class="g2"><div class="card" style="padding:12px"><div class="mapw" style="min-height:300px" onclick="go('map')">${aer(4)}${pins()}<div class="float"><b>Nagapattinam, Tamil Nadu</b><div class="m">${mapService.coords()}</div><button class="btn s" style="width:100%;margin-top:8px">Analyse this location</button></div></div></div>
<div class="card col"><h2>Quick Actions</h2>${[['chat','Ask AI about this location','Get instant insights','map'],['up','Upload Documents','Verify your land records','docs'],['shield','Start Land Audit','Complete analysis report','audit']].map(x=>`<div class="row card" style="cursor:pointer" onclick="go('${x[3]}')"><span class="ico">${ic(x[0])}</span><div style="flex:1"><b>${x[1]}</b><div class="m">${x[2]}</div></div>${ic('arr')}</div>`).join('')}</div></div>
<div class="g2" style="margin-top:16px"><div class="card"><div class="row sp"><h2>Recent Activity</h2><span class="m" style="color:var(--g)">View All</span></div>${[['Land Audit - Nagapattinam','Completed · 2 hours ago','<span class="bd">82/100</span>'],['Land Audit - Mayiladuthurai','In Progress · 4 hours ago','<span class="bd w">Processing</span>']].map(x=>`<div class="li"><span class="ico">${ic('doc')}</span><div style="flex:1"><b>${x[0]}</b><div class="m">${x[1]}</div></div>${x[2]}</div>`).join('')}</div>
<div class="card row"><div><h2>Your Progress</h2><div class="m" style="margin-top:6px">Reports Completed</div><b style="color:var(--g)">You're on track!</b></div><div style="margin-left:auto;text-align:center">${ring(2,90).replace('2%','2')}</div></div></div>`),
map:()=>shell('map',`${hd('AI + Map','Select a spot on the map, then ask the assistant.')}<div class="g4" style="grid-template-columns:.8fr 1.4fr;align-items:start"><div class="card ai"><h2>${ic('chat')} AI Assistant</h2><div class="msgs" id="msgs"></div><div>${['Is there a hospital nearby?','What are the positives and negatives?','What is the road distance?','How is the water availability?'].map(q=>`<button class="q" onclick="ask(this.textContent)">${q}</button>`).join('')}</div><div class="row"><input id="qi" placeholder="Type your question..." onkeydown="if(event.key=='Enter')ask()"><button class="btn" aria-label="Send" onclick="ask()">${ic('send')}</button></div></div>
<div class="card" style="padding:12px"><div class="mapw" id="mp" style="min-height:${innerWidth<769?300:500}px">${aer(4)}<div id="pins">${pins()}</div><div class="float"><div class="row sp"><div><b>Nagapattinam</b><div class="m">Tamil Nadu · <span id="cc">${mapService.coords()}</span></div></div><button class="btn s" onclick="event.stopPropagation();S.saved.unshift({n:'Nagapattinam (saved)',s:'Needs Review',t:'w',seed:9});this.textContent='Saved ✓'">Save Place</button></div></div></div></div></div>`),
docs:()=>shell('docs',`${hd('Document Verification','Upload your land documents for extraction and verification.','<button class="btn o s" onclick="go(\'compare\')">Compare documents</button>')}<div class="g2"><div class="card"><div class="drop"><div style="color:var(--g)">${ic('up')}</div><b>Drag & Drop files here</b><p class="m">PDF, JPG, PNG (Max 10MB)</p><button class="btn s" style="margin-top:8px" onclick="$('#fi').click()">Choose Files</button><input id="fi" type="file" hidden multiple onchange="scan()"></div>
<div class="st" id="stp"><span class="on">1 OCR Processing</span><span>2 Extracted Text</span><span>3 Verification</span></div><div id="ex"><p class="m">Upload a file (or <a href="#" style="color:var(--g)" onclick="scan();return false">use a sample Sale Deed</a>) to run OCR.</p></div></div>
<div class="card"><h2>Uploaded Documents (4)</h2>${['Sale Deed.pdf','Patta.pdf','Chitta.pdf','FMB.pdf'].map((f,i)=>`<div class="li"><span class="ico">${ic('doc')}</span><div style="flex:1">${f}<div class="m">Uploaded</div></div>${ic('arr')}</div>`).join('')}</div></div>`),
compare:()=>shell('compare',`${hd('Document Consistency Check','Fields cross-checked across your uploaded documents.')}<div class="card"><div class="sc"><table><tr><th>Field</th><th>Sale Deed</th><th>Patta</th><th>Chitta</th><th>Status</th></tr>${docCmp.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[1]==r[2]&&r[2]==r[3]?'<span class="bd">Match</span>':'<span class="bd w">Mismatch</span>'}</td></tr>`).join('')}</table></div>
<div class="row card" style="background:#FEF3DC;margin-top:14px;border-color:#f8d98f">${ic('warn')}<div style="flex:1">Potential survey-number mismatch detected between Sale Deed and Patta. Further verification recommended.</div><button class="btn s o" onclick="go('audit')">View Details</button></div></div>`),
audit:()=>{setTimeout(runAudit,0);return shell('audit',`${hd('Land Audit','Comprehensive analysis of your selected property.')}<div class="g4"><div class="card">${['Document Analysis','Official Data Verification','Location & GIS Analysis','Environmental & Risk Analysis','Price Analysis','AI Analysis','Generating Report'].map((s,i)=>`<div class="li"><span class="ico" style="width:28px;height:28px">${i+1}</span>${s}</div>`).join('')}</div>
<div class="card" style="text-align:center"><h2>Analysis in Progress</h2><div id="rg" style="margin:14px 0">${ring(0,170)}</div><p class="m">We're checking your land records and analysing available information.</p><div id="ck" class="col" style="text-align:left;margin-top:12px"></div></div></div>`)},
result:()=>shell('audit',`${hd('Land Audit Results','')}<div class="g2"><div class="card row wrap" style="gap:24px"><div style="text-align:center">${ring(82,170)}<b style="color:var(--g);font-size:18px;display:block">Good</b></div><div style="flex:1;min-width:200px"><h2>Land Readiness Score</h2><p class="m" style="margin-top:6px">This property is generally a good option, but some areas need further verification. This is not legal clearance.</p></div></div>
<div class="card"><h2>Key Findings</h2>${[['ok','Documents largely consistent'],['w','Approval status needs review'],['w','Flood risk: Moderate'],['w','Price slightly above comparison data']].map(x=>`<div class="li"><span class="bd ${x[0]=='w'?'w':''}">${x[0]=='w'?'!':'✓'}</span>${x[1]}</div>`).join('')}</div></div>
<div class="card" style="margin-top:16px"><h2>Score Breakdown</h2><div class="g3" style="margin:14px 0">${[['Documents',18,20],['Official Data',17,20],['Location',14,15],['Environment',11,15],['Price',12,15],['Other',10,15]].map(x=>`<div><div class="row sp"><span class="m">${x[0]}</span><b>${x[1]}/${x[2]}</b></div><div class="bar"><i style="width:${x[1]/x[2]*100}%"></i></div></div>`).join('')}</div><button class="btn" onclick="go('report')">View Detailed Report</button></div>`),
report:()=>shell('report',`${hd('Final Report','','<button class="btn" onclick="print()">⬇ Download PDF</button>')}<div class="row" style="align-items:flex-start"><div class="noprint">${[1,2,3].map(i=>`<div class="th ${i==1?'on':''}"></div>`).join('')}</div><div class="paper" style="flex:1;min-width:0"><div class="row sp"><div><b style="color:var(--g)">${logo.replace('class="logo"','class="logo" style="color:#1E293B"')}</b><h1 style="margin-top:8px">Land Audit Report</h1><span class="m">Nagapattinam, Tamil Nadu</span></div><div style="border:2px solid var(--g);border-radius:12px;padding:8px 16px;text-align:center" class="m">Readiness Score<div style="font-size:28px;font-weight:700;color:var(--g)">82<span class="m">/100</span></div></div></div>
<h3 style="margin:18px 0 6px">Property Summary</h3><table>${[['Location','Nagapattinam, Tamil Nadu'],['Survey Number',S.f['Survey Number']],['Land Area',S.f['Area']],['Asking Price','₹ 45,00,000 (user provided)']].map(r=>`<tr><td class="m" style="width:40%">${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table><div style="height:140px;border-radius:10px;overflow:hidden;position:relative;margin:12px 0">${aer(3)}</div>
<h3>Verification Summary</h3><div class="row wrap" style="margin-top:8px"><span class="bd">Verified: Owner, Village</span><span class="bd w">Needs Review: Survey No.</span><span class="bd e">Potential Risk: Flood</span></div><p class="m" style="margin-top:14px">Based on user-provided documents and basic analysis. Official government verification is not yet integrated.</p></div></div>`),
saved:()=>shell('saved',`${hd('Saved Places','','<button class="btn s" onclick="go(\'map\')">+ Add New Place</button>')}<div class="col">${S.saved.map((s,i)=>`<div class="card row wrap"><div style="width:110px;height:76px;border-radius:10px;overflow:hidden;position:relative">${aer(s.seed)}</div><div style="flex:1;min-width:160px"><b>${s.n}</b><div class="m">Updated 2 days ago</div><span class="bd ${s.t}">${s.s}</span></div><button class="btn s o" onclick="go('map')">View</button><button class="btn s o" style="color:var(--er);border-color:var(--er)" onclick="S.saved.splice(${i},1);render()">Delete</button></div>`).join('')||'<p class="m">No saved places.</p>'}</div>`),
alerts:()=>shell('alerts',`${hd('Alerts','Latest notifications on your audits and documents.')}<div class="card">${S.alerts.map((a,i)=>`<div class="li"><span class="ico" style="${a[0]=='w'?'background:#FEF3DC;color:var(--w)':''}">${ic(a[0]=='w'?'warn':'check')}</span><div style="flex:1"><b>${a[1]}</b><div class="m">${a[2]}</div></div><span class="m">${a[3]}</span><button class="nv" style="width:36px;min-height:36px;padding:0;color:var(--tg)" onclick="S.alerts.splice(${i},1);render()" aria-label="Dismiss">✕</button></div>`).join('')||'<p class="m">All caught up.</p>'}</div>`),
settings:()=>shell('settings',`${hd('Settings','Manage your account and preferences.','<button class="btn o s" onclick="go(\'help\')">Help & Support</button>')}<div class="g4" style="grid-template-columns:200px 1fr;align-items:start"><div class="card col" style="gap:4px;padding:8px">${['Profile','Security','Notifications','Preferences'].map(t=>`<button class="nv ${S.tab==t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('')}</div><div class="card">${{Profile:`<h2>Profile Information</h2><div class="fl" style="margin-top:12px"><label>Full Name<input value="${S.user}"></label><label>Phone<input value="+91 98765 43210"></label><label>Email<input value="gopi@example.com"></label><label>Location<input value="Nagapattinam, Tamil Nadu"></label></div><button class="btn" style="margin-top:14px" onclick="this.textContent='Saved ✓'">Save changes</button>`,Security:`<h2>Change Password</h2><div class="col" style="max-width:360px;margin-top:12px"><input type="password" placeholder="Current password"><input type="password" placeholder="New password"><button class="btn">Update password</button></div>`,Notifications:`<h2>Notifications</h2>${[['e','Email notifications'],['a','Audit completion'],['d','Document verification alerts']].map(x=>`<div class="li"><span style="flex:1">${x[1]}</span><button class="tg ${S.tg[x[0]]?'on':''}" aria-label="${x[1]}" onclick="S.tg['${x[0]}']^=1;render()"></button></div>`).join('')}`,Preferences:`<h2>Preferences</h2><div class="col" style="max-width:360px;margin-top:12px"><label class="m">Language<select><option>English</option><option>தமிழ்</option></select></label><label class="m">Theme<select onchange="document.documentElement.dataset.theme=this.value"><option value="light">Light</option><option value="dark">Dark</option></select></label></div>`}[S.tab]}</div></div>`),
help:()=>shell('help',`${hd('Help & Support',"We're here to help you!")}<div class="g4"><div class="col">${[['help','FAQs','Find answers to common questions'],['chat','Contact Support','Get help from our support team'],['doc','User Guide','Learn how to use the platform'],['warn','Report an Issue','Share your feedback']].map(x=>`<div class="card row" style="cursor:pointer"><span class="ico">${ic(x[0])}</span><div style="flex:1"><b>${x[1]}</b><div class="m">${x[2]}</div></div>${ic('arr')}</div>`).join('')}</div>
<div class="card" style="text-align:center;display:grid;place-items:center;gap:8px"><svg width="180" height="150" viewBox="0 0 180 150"><circle cx="90" cy="45" r="22" fill="#f4c9a4"/><path d="M60 40a30 28 0 0160 0z" fill="#0B2D3A"/><path d="M50 130c0-30 18-52 40-52s40 22 40 52z" fill="#0C9F6E"/><rect x="45" y="100" width="90" height="40" rx="4" fill="#0B2D3A"/><rect x="52" y="106" width="76" height="26" rx="2" fill="#E6F6FF"/></svg><h2>Need Help?</h2><p class="m">Our support team is available 24/7 to assist you.</p><button class="btn" style="width:100%" onclick="this.textContent='Support notified ✓'">Contact Support</button></div></div>`)};
/* ---- behaviour ---- */
function pins(){return Object.values(POI).map(p=>`<div class="pin" style="left:${p.x}%;top:${p.y}%"><span>${p.i}</span></div>`).join('')+`<div class="pin me" style="left:${S.p[0]}%;top:${S.p[1]}%"><span>●</span></div>`}
function bubbles(){const e=$('#msgs');if(!e)return;e.innerHTML=S.chat.map(m=>`<div class="b ${m.u?'u':''}">${m.u||m.a}</div>`).join('');e.scrollTop=1e5}
function ask(t){const i=$('#qi'),q=t||i.value.trim();if(!q)return;i.value='';S.chat.push({u:q});bubbles();setTimeout(()=>{S.chat.push({a:aiService.ask(q)});bubbles()},400)}
async function scan(){$('#ex').innerHTML='<p class="m">Running OCR…</p><div class="bar"><i id="ob" style="width:0"></i></div>';setTimeout(()=>$('#ob').style.width='100%',50);const f=await ocrService.run();$('#stp').innerHTML='<span>1 OCR Processing</span><span class="on">2 Extracted Text</span><span>3 Verification</span>';
$('#ex').innerHTML=`<h2>Extracted Text (Preview)</h2><p class="m">Review and edit before continuing.</p><div class="fl" style="margin:10px 0">${Object.keys(f).map(k=>`<label>${k}<input value="${f[k]}" oninput="S.f['${k}']=this.value"></label>`).join('')}</div><button class="btn" onclick="go('compare')">Confirm & Continue</button>`}
function runAudit(){let v=0;const L=['Document analysis','Official data verification','Location analysis','Environmental data','Price comparison','AI analysis'];clearInterval(tm);tm=setInterval(()=>{v+=5;const r=$('#rg');if(!r){clearInterval(tm);return}r.innerHTML=ring(v,170);$('#ck').innerHTML=L.map((l,i)=>`<div class="row"><span style="color:${v>(i+1)*16?'var(--ok)':'var(--tg)'}">${ic('check')}</span>${l}</div>`).join('');if(v>=100){clearInterval(tm);setTimeout(()=>go('result'),500)}},180)}
function render(){const r=location.hash.replace('#/','')||'landing';const f=r=='signup'?()=>V.login(1):V[r]||V.landing;$('#app').innerHTML=f();if(r=='map'){bubbles();S.chat.length||(S.chat.push({a:"Hi! I'm your Land Assistant.<br>Ask me anything about this location."}),bubbles());const m=$('#mp');m.onclick=e=>{const b=m.getBoundingClientRect();S.p=[(e.clientX-b.left)/b.width*100,(e.clientY-b.top)/b.height*100];$('#pins').innerHTML=pins();$('#cc').textContent=mapService.coords()}}scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>

function shell(title,sub,body,rp){const audit=rp!==false;return`<div class="shell ${S.col?"col":""}"><aside class="side ${S.mob?"open":""}" aria-label="Main navigation"><div class="lg"><b>TN</b><span class="tx">Land Audit</span></div>${NAV.map(n=>`<button class="nv ${S.v==n[0]?"on":""}" data-t="${n[1]}" onclick="${n[0]=="wiz"?"S.step=1;":""}go('${n[0]}')">${ic(n[2])}<span class="tx">${n[1]}</span></button>`).join("")}<div class="sp"></div>${[["gear","Settings"],["help","Help"],["user","Profile"]].map(n=>`<button class="nv" data-t="${n[1]}" onclick="toast('${n[1]} is not part of this prototype.')">${ic(n[0])}<span class="tx">${n[1]}</span></button>`).join("")}<button class="nv" data-t="Collapse" onclick="S.col=!S.col;render()" aria-label="Collapse sidebar">${ic("swap")}<span class="tx">Collapse</span></button></aside>
<div class="wrap ${audit?"":"nor"}"><div class="hdr"><button class="btn o s mn" onclick="S.mob=!S.mob;render()" aria-label="Menu">${ic("menu")}</button><div class="c"><b>${title}</b><br><small>${sub}</small></div>
<span class="chip A">Analysis Complete</span><div style="position:relative"><button class="btn o s" onclick="S.nt=!S.nt;render()" aria-label="Notifications">${ic("bell")} 3</button>${S.nt?`<div class="pop">${[["Critical finding: layout approval not verified","R"],["Sale Deed OCR needs 3 confirmations","A"],["Analysis complete for CASE-2026-001","G"]].map(x=>`<div style="padding:7px 0;border-bottom:1px solid var(--ln)">${chip(x[1],"")} ${x[0]}</div>`).join("")}</div>`:""}</div>
<select aria-label="Language" style="width:auto;margin:0" onchange="S.lang=this.value;render()"><option value="EN">English</option><option value="TA" ${S.lang=="TA"?"selected":""}>தமிழ்</option></select><span class="chip B" title="Signed in">Priya S.</span></div>
<main class="ws fade">${body}</main>${audit?rpanel():""}</div></div>${audit?`<button class="btn fab" onclick="S.rp=!S.rp;render()">${ic("bot")} Land Audit AI</button>`:""}`}
const CASE="Residential Plot — Nagapattinam",CID="CASE-2026-001";
function A(v,b,n){return shell(CASE,`${CID} · Survey No. 124/3A`,(n?stp(n):"")+b)}

function dash(){const C=[["CASE-2026-001","Residential Plot — Nagapattinam","124/3A","Analysis Complete","78/100",100,"A"],["CASE-2026-002","Agricultural Land — Thanjavur","58/2B","Documents Pending","—",35,"N"],["CASE-2026-003","Plot — Tambaram","214/3","Verification Pending","—",60,"A"],["CASE-2026-004","Commercial — Coimbatore","19/7","Report Ready","84/100",100,"G"]];
return shell("Your Land Audit Workspace","Good morning, Priya",`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><h1 class="h1">Good morning</h1><button class="btn" onclick="S.step=1;go('wiz')">+ New Land Audit</button></div>
<div class="g4">${[["Active Audits",3,"T"],["Reports Ready",1,"G"],["Verification Pending",2,"A"],["Critical Findings",1,"R"]].map(x=>`<div class="card"><div style="color:var(--mu);font-size:12px">${x[0]}</div><div style="font-size:28px;font-weight:700">${x[1]}</div>${chip(x[2],x[2]=="R"?"Needs attention":x[2]=="G"?"Ready":"In workflow")}</div>`).join("")}</div>
<div class="card tw" style="margin-top:14px"><h3>Recent audits</h3><table><tr><th>Case</th><th>Property</th><th>Survey no.</th><th>Status</th><th>Readiness</th><th>Progress</th><th>Updated</th><th></th></tr>${C.map((c,i)=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${chip(c[6],c[3])}</td><td>${c[4]}</td><td style="min-width:90px"><div class="bar"><i style="width:${c[5]}%"></i></div></td><td>${i<2?"Today":"28 Sep"}</td><td><button class="btn o s" onclick="${i==0?"go('ov')":i==3?"go('rep')":"S.step=1;go('wiz')"}">${i==0?"Open":i==3?"Report":"Continue"}</button></td></tr>`).join("")}</table></div>`,false)}
function props(){return shell("My Properties","4 cases",`<h1 class="h1" style="margin-bottom:12px">My Properties</h1><div class="g2">${[["Residential Plot","Nagapattinam","124/3A","2400 sq.ft"],["Agricultural Land","Thanjavur","58/2B","1.2 acre"],["Plot","Tambaram","214/3","1800 sq.ft"],["Commercial","Coimbatore","19/7","3200 sq.ft"]].map(p=>`<div class="card"><b>${p[0]} — ${p[1]}</b><div style="color:var(--mu)">Survey ${p[2]} · ${p[3]}</div><button class="btn o s" style="margin-top:10px" onclick="go('dash')">View case</button></div>`).join("")}</div>`,false)}

function wiz(){const f=S.f,e=S.er,inp=(k,l,ph)=>`<div><label>${l}<input value="${f[k]}" placeholder="${ph||""}" oninput="S.f['${k}']=this.value"></label><span class="er">${e[k]||""}</span></div>`,sel=(k,l,o)=>`<label>${l}<select onchange="S.f['${k}']=this.value">${o.map(x=>`<option ${f[k]==x?"selected":""}>${x}</option>`).join("")}</select></label>`;
const b=S.step==1?`<div class="card"><h3>Property details</h3><div class="fm">${sel("type","Property type",["Plot","Agricultural Land","Residential","Commercial","Industrial","Other"])}${sel("purpose","Purchase purpose",["Residence","Agriculture","Investment","Development","Business"])}${inp("seller","Seller name","e.g. Ramesh Kumar")}${inp("ext","Property extent","e.g. 2400")}${sel("unit","Unit",["sq.ft","sq.m","cent","ground","acre","hectare"])}${inp("sno","Survey number","e.g. 124/3A")}${inp("sub","Subdivision number","e.g. 3A")}${inp("patta","Patta / TSLR number","e.g. 1482")}</div><label style="margin-top:12px">Claims made by seller or broker (optional)<textarea rows="2" oninput="S.f.claims=this.value" placeholder="e.g. DTCP-approved layout; hospital within 2 km">${f.claims}</textarea></label><p><button class="btn o" onclick="toast('Draft saved')">Save draft</button> <button class="btn" onclick="n1()">Continue to location</button></p></div>`:
`<div class="card"><h3>Confirm location</h3><div class="fm" style="margin-bottom:12px"><label>Search location<input placeholder="e.g. Velankanni Road, Nagapattinam"></label><label>Search address<input placeholder="Street or landmark"></label><div style="align-self:end"><button class="btn o" onclick="toast('Demo map: no live geocoder is connected. Move the pin by clicking the map.')">Search</button></div></div>${mapBox()}
<div class="fm" style="margin-top:12px">${[["Latitude",ll()[0]],["Longitude",ll()[1]],["District","Nagapattinam"],["Taluk","Nagapattinam"],["Village / Town","Nagapattinam"],["Local body","Nagapattinam Municipality"]].map(x=>`<div><label>${x[0]}</label><b>${x[1]}</b></div>`).join("")}</div><p class="note" style="margin-top:12px">Map location is confirmed separately from survey identity. The pin does not prove the survey number.</p><p><button class="btn o" onclick="S.step=1;render()">Back</button> <button class="btn" onclick="go('docs')">Continue to documents</button></p></div>`;
return shell("New Land Audit","Draft · not yet saved as a case",stp(S.step)+b,false)}
function n1(){const f=S.f,e={};if(!f.seller.trim())e.seller="Enter the seller name";if(!(+f.ext>0))e.ext="Enter the extent as a number";if(!/^\d{1,5}(\/\d{1,3}[A-Za-z]?)?$/.test(f.sno.trim()))e.sno="Use a format like 124/3A";if(!f.patta.trim())e.patta="Enter the Patta or TSLR number";S.er=e;if(Object.keys(e).length)return render();S.step=2;render()}
const ll=()=>[(10.7656-(S.pin[1]-150)*.00012).toFixed(5)+"° N",(79.843+(S.pin[0]-240)*.00014).toFixed(5)+"° E"];
function pin(e){const r=e.currentTarget.getBoundingClientRect();S.pin=[Math.round((e.clientX-r.left)/r.width*480),Math.round((e.clientY-r.top)/r.height*300)];render()}
function mapSvg(){const L=S.lay,U=S.lay2,p=S.pin,hat=(k,t)=>U[k]?`<rect width="480" height="300" fill="url(#h)" opacity=".8"/><text x="240" y="150" text-anchor="middle" font-size="13" fill="#5c6a7e">${t}: Not verified — no data source</text>`:"";
return`<svg viewBox="0 0 480 300" aria-label="Interactive map"><defs><pattern id="h" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="4" height="8" fill="#cfd6df"/></pattern></defs><rect width="480" height="300" fill="#eef3ee"/>${L.water?`<path d="M340 0 Q310 110 360 190 T330 300 H480 V0Z" fill="#bfe0ea"/><text x="395" y="120" font-size="10" fill="#3d7a8a">Waterbody</text>`:""}${L.roads?`<path d="M0 190 Q150 170 480 210" stroke="#fff" stroke-width="10" fill="none"/><path d="M200 0 Q210 150 190 300" stroke="#fff" stroke-width="7" fill="none"/><text x="20" y="182" font-size="9" fill="#5f6f88">Velankanni Rd</text>`:""}${L.hosp?`<g><rect x="90" y="70" width="20" height="20" rx="4" fill="#bf2b2b"/><text x="100" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">H</text></g>`:""}${L.coll?`<g><rect x="390" y="230" width="20" height="20" rx="4" fill="#12356f"/><text x="400" y="245" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">C</text></g>`:""}<circle cx="${p[0]}" cy="${p[1]}" r="14" fill="#0e97a8" opacity=".18"/><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#0e97a8" stroke="#fff" stroke-width="2.5"/>${hat("flood","Flood risk")}${hat("env","Environment")}${hat("plan","Planning")}${hat("infra","Infrastructure")}</svg>`}
const mapBox=()=>`<div class="map" onclick="pin(event)" title="Click to move the pin">${mapSvg()}</div>`;

function docs(){const T=[["up","Upload"],["ocr","OCR review"],["cmp","Comparison"]];
const up=`<div class="g2">${DOCS.map((d,i)=>{const u=S.up[i],st=u?u.p<100?["B","Processing"]:["T","OCR Complete"]:[d[1],d[2]];return`<div class="doc"><div style="display:flex;justify-content:space-between;gap:6px"><b>${d[0]}</b>${chip(st[0],st[1])}</div><div style="color:var(--mu);font-size:12.5px;min-height:20px">${u?u.n:d[3]||(d[2]=="Missing"?"Not uploaded. Missing evidence lowers the Evidence Quality score.":"")}</div>${u&&u.p<100?`<div class="bar"><i style="width:${u.p}%"></i></div>`:""}<label class="btn o s" style="display:inline-block;margin-top:8px;cursor:pointer">${d[2]=="Missing"||u?"Upload":"Replace"}<input type="file" hidden accept=".pdf,.jpg,.jpeg,.png" onchange="upl(${i},this.files[0])"></label>${d[2]=="Needs Review"&&!u?` <button class="btn s" onclick="S.dt='ocr';render()">Review</button>`:""}</div>`}).join("")}</div><p class="note" style="margin-top:12px">PDF, JPG or PNG up to 10 MB. Files are not read in this prototype; the sample extraction shown is fixed demo data.</p>`;
const low=S.ex.filter((x,i)=>x[2]<95&&!S.cf[i]).length,f=S.ex[S.sel];
const ocr=`<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div><div class="chip B" style="margin-bottom:6px">Sale Deed · Page 3 of 6</div><div class="view"><div style="text-align:center;font-weight:700">விற்பனை பத்திரம் / SALE DEED</div>${["This deed is made between","Vendor: <span data-l=0></span>","Purchaser: Priya Sundaram","Property at S.No. <span data-l=1></span>, Subdivision 3A","Extent: <span data-l=2></span> in the","Village: <span data-l=3></span>, Nagapattinam Taluk","Registered on <span data-l=4></span>","Doc. No. <span data-l=5></span>"].join("<br>").replace(/<span data-l=(\d)><\/span>/g,(m,n)=>{const v=S.ex[n][1];return +n==S.sel?`<mark>${v}</mark>`:v})}</div></div>
<div><h3>Extracted information ${low?chip("A",low+" fields require confirmation"):chip("G","All fields confirmed")}</h3>${S.ex.map((x,i)=>{const lw=x[2]<95&&!S.cf[i];return`<button class="fld ${i==S.sel?"on":""} ${lw?"low":""}" onclick="S.sel=${i};render()"><div style="display:flex;justify-content:space-between"><span style="color:var(--mu);font-size:12px">${x[0]}</span>${S.cf[i]?chip("G","Confirmed"):chip(lw?"A":"T",x[2]+"% confidence")}</div><b>${x[1]}</b></button>`}).join("")}
<label>Edit selected value<input value="${f[1]}" onchange="S.ex[S.sel][1]=this.value;S.cf[S.sel]=0;render()"></label><p><button class="btn" onclick="S.cf[S.sel]=1;render()">Confirm ${f[0].toLowerCase()}</button></p></div></div>`;
const cell=c=>`<td>${chip(c[1],c[0])}</td>`,cmp=`<div class="card tw"><table><tr><th>Field</th><th>Sale Deed</th><th>Patta</th><th>EC</th><th>FMB</th><th>Result</th><th></th></tr>${CMP.map(r=>`<tr><td><b>${r[0]}</b></td>${cell(r[1])}${cell(r[2])}${cell(r[3])}${cell(r[4])}<td>${chip(r[5],r[5]=="G"?"Match":"Difference / Review")}</td><td><button class="btn o s" onclick="openEv('${r[6]}')">View evidence</button></td></tr>`).join("")}</table></div><p class="note" style="margin-top:12px">Grey means the document does not contain that field. It is never counted as a match.</p>`;
return A("docs",`<h1 class="h1" style="margin-bottom:10px">Property Documents</h1><div class="tab">${T.map(t=>`<button class="${S.dt==t[0]?"on":""}" onclick="S.dt='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${{up,ocr,cmp}[S.dt]}<p style="margin-top:14px"><button class="btn" onclick="S.vt='pipe';go('verify')">Continue to verification</button></p>`,3)}
function upl(i,fl){if(!fl)return;if(!/\.(pdf|jpe?g|png)$/i.test(fl.name)||fl.size>10485760)return toast("Unsupported file. Use PDF, JPG or PNG up to 10 MB.");S.up[i]={n:fl.name,p:0};render();const t=setInterval(()=>{S.up[i].p+=25;render();if(S.up[i].p>=100)clearInterval(t)},300)}

const NEAR=[["Government Hospital","1.8 km","Straight-line"],["Government Arts College","2.4 km","Straight-line"],["Velankanni Road (main road)","850 m","Straight-line"],["Waterbody (tank)","410 m","Straight-line"]];
function mapv(){const LY=[["roads","Roads",1],["hosp","Hospitals",1],["coll","Colleges",1],["water","Water bodies",1],["flood","Flood risk",0],["env","Environment",0],["plan","Planning",0],["infra","Infrastructure",0]];
return A("map",`<h1 class="h1" style="margin-bottom:10px">Map & GIS Intelligence</h1><div class="g2" style="grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr)"><div class="card">${mapBox()}<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px">${LY.map(l=>{const on=l[2]?S.lay[l[0]]:S.lay2[l[0]];return`<label style="font-weight:500;color:var(--ink)"><input type="checkbox" style="width:auto;margin-right:5px" ${on?"checked":""} onchange="${l[2]?`S.lay['${l[0]}']=this.checked`:`S.lay2['${l[0]}']=this.checked`};render()">${l[1]} ${l[2]?"":chip("N","Not verified")}</label>`}).join("")}</div><p class="note" style="margin-top:10px">Pin ${ll()[0]}, ${ll()[1]}. Map location is confirmed separately from survey identity; no parcel boundary is drawn because no boundary geometry is available.</p></div>
<div class="card"><h3>Property Intelligence</h3><b>Nearby places</b><table>${NEAR.map(n=>`<tr><td>${n[0]}</td><td>${n[1]}<br>${chip("A",n[2])}</td></tr>`).join("")}</table><p style="font-size:12.5px;color:var(--mu)">Provider: sample map data (demo) · Retrieved 30 Sep 2026, 10:42 IST. Straight-line distances are not road distances.</p>
${[["Road access","N","Road exists; width and right of way not verified"],["Water & environment","N","Waterbody nearby; flood and groundwater data unavailable"],["Planning layers","N","No DTCP layer connected"],["Infrastructure","N","No utility layer connected"]].map(x=>`<div style="padding:7px 0;border-top:1px solid var(--ln)"><b>${x[0]}</b> ${chip(x[1])}<br><span style="font-size:12.5px;color:var(--mu)">${x[2]}</span></div>`).join("")}</div></div>`)}

function src(){return A("src",`<h1 class="h1" style="margin-bottom:6px">Data Sources</h1><p class="note w" style="margin-bottom:12px">No government system is live-connected in this prototype. Statuses below show what is actually available.</p><div class="g2">${SRC.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${s[0]}</b>${chip(s[1],s[2])}</div>${[["Access method",s[3]],["Coverage",s[4]],["Last checked",s[5]]].map(x=>`<div style="font-size:12.5px;margin-top:6px"><span style="color:var(--mu)">${x[0]}:</span> ${x[1]}</div>`).join("")}<div style="margin-top:8px">${chip("B",s[1]=="ASSISTED"?"User uploaded":s[1]=="DEMO"?"Map/API":s[1]=="PENDING"?"Manual verification":"Unavailable")}</div></div>`).join("")}</div>`)}

function verify(){const T=[["pipe","Analysis"],["cat","Categories"],["sc","Readiness score"]];let b;
if(S.vt=="pipe"){const pct=Math.round(S.pipe/PIPE.length*100);b=`<div class="card"><h3>Land Audit Analysis <span style="float:right"><button class="btn o s" onclick="rerun()">Re-run analysis</button></span></h3><div class="bar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div><div class="pl">${PIPE.map((p,i)=>{const s=i<S.pipe?(i==8?"v":"d"):i==S.pipe?"p":"";const lb=i==8&&S.pipe>8?"Needs Review":i<S.pipe?"Completed":i==S.pipe?"Processing":"Pending";return`<div class="${s}"><span class="dt">${i<S.pipe?(i==8?"!":"✓"):i+1}</span><b style="flex:1">${p}</b>${chip(i<S.pipe?(i==8?"A":"G"):i==S.pipe?"T":"N",lb)}</div>`}).join("")}</div><p class="note" style="margin-top:12px">Rules validate fields and calculate the score. AI reads documents and drafts explanations. Human Review waits on 3 unconfirmed OCR fields.</p></div>`}
else if(S.vt=="cat")b=`<div class="g2">${CATS.map((c,i)=>{const sc=catSc(i),ratio=sc/c[1],k=FD.some(f=>f[2]==i&&f[1]=="R")?"R":ratio<.75||FD.some(f=>f[2]==i&&f[1]=="N")?"A":"G",n=FD.filter(f=>f[2]==i&&f[4]>0);return`<div class="card"><div style="display:flex;justify-content:space-between;gap:6px"><b>${c[0]}</b>${chip(k,k=="R"?"Critical":k=="A"?"Review":"Clear")}</div><div style="font-size:24px;font-weight:700">${sc}<span style="font-size:13px;color:var(--mu)"> / ${c[1]}</span></div><div class="bar"><i style="width:${ratio*100}%"></i></div><div style="font-size:12.5px;color:var(--mu);margin:8px 0">${c[2]}% confidence · ${c[3]} evidence items · ${n.length} issue${n.length==1?"":"s"}</div><button class="btn o s" onclick="openEv('${(FD.find(f=>f[2]==i)||FD[0])[0]}')">View evidence</button></div>`}).join("")}</div>`;
else b=score();
return A("verify",`<h1 class="h1" style="margin-bottom:10px">Verification Center</h1><div class="tab">${T.map(t=>`<button class="${S.vt==t[0]?"on":""}" onclick="S.vt='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${b}`,S.vt=="sc"?5:4)}
let pt;function rerun(){S.pipe=0;render();clearInterval(pt);pt=setInterval(()=>{S.pipe++;if(S.v=="verify"&&S.vt=="pipe")render();if(S.pipe>=9)clearInterval(pt)},500)}
function score(){const st=FD.some(f=>f[1]=="R")?"PAUSE & VERIFY":SCORE>=85?"PROCEED WITH CHECKS":"CAUTION";
return`<div class="card" style="display:flex;gap:22px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 120 120" width="150" role="img" aria-label="Readiness score ${SCORE} of 100"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--nb)" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="var(--tl)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${SCORE*3.14} 400" transform="rotate(-90 60 60)" style="transition:stroke-dasharray 1s"/><text x="60" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="var(--ink)">${SCORE}</text><text x="60" y="80" text-anchor="middle" font-size="11" fill="var(--mu)">/ 100</text></svg><div style="flex:1;min-width:230px"><div style="color:var(--mu)">Land Audit Readiness Score</div><span class="chip A" style="font-size:14px;margin:4px 0">${st}</span><p style="margin:6px 0">Evidence coverage: <b>81%</b> (17 of 21 checks backed by evidence)</p><p class="note">Decision-support indicator — not legal certification. A high score does not mean the land is safe.</p></div></div>
<div class="g2" style="margin-top:14px"><div class="card"><h3>Category breakdown</h3>${CATS.map((c,i)=>`<div style="display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:8px"><span>${c[0]}</span><b>${catSc(i)}/${c[1]}</b><div class="bar" style="grid-column:1/-1"><i style="width:${catSc(i)/c[1]*100}%"></i></div></div>`).join("")}</div>
<div class="card"><h3>Why this score? <span class="chip R">−${ded}</span></h3>${FD.filter(f=>f[4]).sort((a,b)=>b[4]-a[4]).map(f=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)"><span>${f[3]}</span><b style="color:var(--r)">−${f[4]}</b></div>`).join("")}<p style="font-size:12.5px;color:var(--mu)">100 − ${ded} = ${SCORE}. Each deduction links to a finding.</p><div class="note w"><b>Critical override:</b> a Critical finding (F-01) keeps the status at PAUSE & VERIFY regardless of score. Bands: 85+ with no Critical = Proceed with checks; 60–84 or any Critical = Pause & Verify; below 60 = Caution.</div></div></div><p><button class="btn" onclick="go('rep')">Generate report</button></p>`}
